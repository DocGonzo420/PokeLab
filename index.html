<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Log your Pokemon cards from photos with official set numbers, rarity, condition and live prices.">
<meta name="theme-color" content="#131920">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Poke Lab">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Poke Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,600..800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a binder page. Sticky value header, filter strip, one column of sleeves (rows), a fixed Add button. Sheets slide up for adding and for card details. */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --sunk:#E2E6EC; --ink:#131920; --muted:#5A6572; --line:#D3D9E1;
  --accent:#C9362B; --accent-ink:#FFFFFF; --focus:#2F6FEB;
  --ok:#1F7A4D; --warn:#A35D00;
  --tier-common:#6B7684; --tier-rare:#2F62C9; --tier-ultra:#7A3FC2; --tier-secret:#A86F00;
  --holo:linear-gradient(100deg,#ff8a8a,#ffd36e 22%,#9cf0a8 42%,#79c7ff 62%,#c49bff 82%,#ff8ad1);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1217; --surface:#171C23; --sunk:#11161C; --ink:#E8ECF1; --muted:#98A3AF; --line:#2A323C;
  --accent:#EE5A4A; --accent-ink:#1A0B09; --focus:#7AA7FF; --ok:#5CC38E; --warn:#E3A44A;
  --tier-common:#9AA5B2; --tier-rare:#79A2F2; --tier-ultra:#B994F0; --tier-secret:#E4B54E;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1217; --surface:#171C23; --sunk:#11161C; --ink:#E8ECF1; --muted:#98A3AF; --line:#2A323C;
  --accent:#EE5A4A; --accent-ink:#1A0B09; --focus:#7AA7FF; --ok:#5CC38E; --warn:#E3A44A;
  --tier-common:#9AA5B2; --tier-rare:#79A2F2; --tier-ultra:#B994F0; --tier-secret:#E4B54E;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:0;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:12px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand h1{margin:0;font:800 22px/1 var(--f-display);font-stretch:85%;letter-spacing:.01em;text-wrap:balance}
.brand .sub{font-size:12px;color:var(--muted)}
.holo-rule{height:3px;background:var(--holo);opacity:.85}
.value{text-align:right}
.value .label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.value .big{font:800 28px/1.05 var(--f-display);font-stretch:80%;font-variant-numeric:tabular-nums}
.value .meta{font-size:12px;color:var(--muted)}

/* Notices */
.notice{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--sunk);border:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:flex-start}
.notice b{color:var(--ink);font-weight:600}
.notice .x{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--muted);padding:0 2px;font-size:16px;line-height:1}

/* Filters */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.filters .search{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
input[type=search],input[type=text],input[type=number],select{width:100%;min-width:0;height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
@media (min-width:620px){.filters{grid-template-columns:2fr 1fr 1fr 1fr}.filters .search{grid-column:auto}}

/* Collection list */
.list{display:flex;flex-direction:column;gap:8px;margin:14px 0 120px;padding:0;list-style:none}
.row{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:8px 12px 8px 8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;text-align:left;width:100%}
.row:hover{border-color:var(--muted)}
.thumb{width:56px;aspect-ratio:63/88;border-radius:5px;background:var(--sunk);overflow:hidden;display:grid;place-items:center;max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.row .main{min-width:0;display:flex;flex-direction:column;gap:3px}
.row .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .setline{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.chip.t-common{color:var(--tier-common)}.chip.t-rare{color:var(--tier-rare)}.chip.t-ultra{color:var(--tier-ultra)}.chip.t-secret{color:var(--tier-secret)}
.chip.grade{color:var(--ink);border-color:var(--line);background:var(--sunk)}
.row .price{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.row .price b{font:700 17px/1 var(--f-display);font-stretch:85%;font-variant-numeric:tabular-nums}
.row .price span{font-size:11px;color:var(--muted)}

.empty{margin:28px 0 120px;padding:24px 20px;border:1.5px dashed var(--line);border-radius:16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h2{margin:0;font:800 22px/1.15 var(--f-display);font-stretch:85%;text-wrap:balance}
.empty p{margin:0;color:var(--muted);max-width:44ch}
.sleeve{width:84px;aspect-ratio:63/88;border-radius:8px;border:2px solid var(--line);position:relative;overflow:hidden;background:var(--sunk)}
.sleeve::after{content:"";position:absolute;inset:0;background:var(--holo);opacity:.28}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--accent);border-color:var(--accent);background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btn.small{height:34px;padding:0 12px;font-size:13px}
.linkbtn{background:none;border:0;padding:0;color:var(--focus);cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;height:54px;padding:0 22px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);font:700 16px/1 var(--f-display);font-stretch:90%;letter-spacing:.02em;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgb(0 0 0 / .25);cursor:pointer}
.fab .dot{width:22px;height:22px;border-radius:6px;background:var(--holo)}

/* Sheets */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:720px;max-height:92vh;max-height:92dvh;border-radius:18px 18px 0 0;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.sheet::backdrop{background:rgb(8 10 14 / .55)}
@media (min-width:760px){dialog.sheet{margin:auto;border-radius:18px;max-height:88vh}}
.sheet-inner{display:flex;flex-direction:column;max-height:inherit}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font:800 19px/1.1 var(--f-display);font-stretch:85%}
.close{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;line-height:1}
.sheet-body{overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.section-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}

.pickers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.picker{height:96px;border-radius:14px;border:1.5px dashed var(--line);background:var(--sunk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-weight:600;position:relative}
.picker small{font-weight:400;color:var(--muted);font-size:12px}
.picker input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}

.shot{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:start}
.shot img{width:110px;aspect-ratio:63/88;object-fit:cover;border-radius:8px;background:var(--sunk);max-width:100%}
.status{display:flex;flex-direction:column;gap:6px;min-width:0}
.status .line{font-size:14px}
.read{font-size:13px;color:var(--muted)}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;display:inline-block;vertical-align:-3px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}

.cands{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.cand{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:8px 10px 8px 8px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface);width:100%;text-align:left}
.cand[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.cand .thumb{width:42px}
.cand .t{min-width:0}
.cand .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.cand .t span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cand .tick{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line)}
.cand[aria-pressed="true"] .tick{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 4px var(--surface)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px}
.qty input{text-align:center;width:56px;flex:none}

/* Grade "slab label" */
.slab{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.slab-top{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 14px;background:var(--sunk)}
.slab-top .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.slab-top .g{font:800 34px/1 var(--f-display);font-stretch:80%;text-align:right}
.slab-top .g small{display:block;font:500 11px/1.2 var(--f-body);color:var(--muted);letter-spacing:.02em}
.slab dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;padding:12px 14px;font-size:13.5px}
.slab dt{color:var(--muted)}
.slab dd{margin:0;min-width:0}
.slab .disclaim{padding:0 14px 12px;font-size:12px;color:var(--muted)}

/* Detail */
.detail-hero{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.detail-hero figure{margin:0;display:flex;flex-direction:column;gap:6px}
.detail-hero img{width:100%;aspect-ratio:63/88;object-fit:cover;border-radius:10px;background:var(--sunk);max-width:100%}
.detail-hero figcaption{font-size:11px;color:var(--muted);text-align:center}
.ph{width:100%;aspect-ratio:63/88;border-radius:10px;background:var(--sunk);display:grid;place-items:center;text-align:center;padding:10px;font-size:12px;color:var(--muted);max-width:100%}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fact{padding:10px 12px;border:1px solid var(--line);border-radius:10px;min-width:0}
.fact .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.fact .v{font-weight:600;overflow-wrap:anywhere}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
tbody tr:last-child td{border-bottom:0}
tr.mine td{background:var(--sunk);font-weight:600}
.src{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.confirm{padding:12px;border:1px solid var(--accent);border-radius:10px;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
.err{color:var(--accent);font-size:13px}
/* Centering tool */
.cen-stage{position:relative;width:fit-content;max-width:100%;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:8px;overflow:hidden;background:var(--sunk)}
.cen-stage img{display:block;max-width:100%;max-height:60vh;max-height:60dvh;width:auto;height:auto;pointer-events:none}
.cen-line{position:absolute;z-index:1;outline-offset:-4px}
.cen-line.v{top:0;bottom:0;width:30px;margin-left:-15px;cursor:ew-resize}
.cen-line.h{left:0;right:0;height:30px;margin-top:-15px;cursor:ns-resize}
.cen-line::after{content:"";position:absolute;background:var(--c);box-shadow:0 0 0 1px rgb(255 255 255 / .55)}
.cen-line.v::after{left:14px;top:0;bottom:0;width:2px}
.cen-line.h::after{top:14px;left:0;right:0;height:2px}
.cen-line.outer{--c:var(--accent)}
.cen-line.inner{--c:var(--focus)}
.cen-read{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cen-read .fact .v{font:700 20px/1.1 var(--f-display);font-stretch:85%;font-variant-numeric:tabular-nums}
.key-outer{color:var(--accent);font-weight:600}.key-inner{color:var(--focus);font-weight:600}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Poke Lab</h1>
      <span class="sub" id="modeLine">Card catalogue</span>
    </div>
    <div class="value">
      <div class="label">Collection value</div>
      <div class="big" id="totalValue">$0.00</div>
      <div class="meta" id="totalMeta">0 cards</div>
    </div>
  </div>
  <div class="holo-rule"></div>
</header>

<main class="wrap">
  <div id="notices"></div>
  <div class="filters" id="filters">
    <div class="field search"><label for="q">Search your cards</label><input id="q" type="search" placeholder="Name, set or number" autocomplete="off"></div>
    <div class="field"><label for="fSet">Set</label><select id="fSet"><option value="">All sets</option></select></div>
    <div class="field"><label for="fRarity">Rarity</label><select id="fRarity"><option value="">All rarities</option></select></div>
    <div class="field"><label for="fSort">Sort</label>
      <select id="fSort"><option value="value">Highest value</option><option value="recent">Recently added</option><option value="set">Set and number</option><option value="name">Name</option></select></div>
  </div>
  <ul class="list" id="list"></ul>
  <div class="empty" id="empty" hidden>
    <div class="sleeve" aria-hidden="true"></div>
    <h2>Your binder is empty</h2>
    <p id="emptyText">Tap Add a card and take a photo of the front. The card gets matched to its official set and number, then logged with its rarity, a condition estimate and its price.</p>
    <button class="btn primary" type="button" id="emptyAdd">Add your first card</button>
  </div>
</main>

<button class="fab" id="fab" type="button"><span class="dot" aria-hidden="true"></span>Add a card</button>

<dialog class="sheet" id="addSheet" aria-labelledby="addTitle">
  <div class="sheet-inner">
    <div class="sheet-head"><h2 id="addTitle">Add a card</h2><button class="close" type="button" data-close aria-label="Close">×</button></div>
    <div class="sheet-body" id="addBody"></div>
  </div>
</dialog>

<dialog class="sheet" id="detailSheet" aria-labelledby="detailTitle">
  <div class="sheet-inner">
    <div class="sheet-head"><h2 id="detailTitle">Card</h2><button class="close" type="button" data-close aria-label="Close">×</button></div>
    <div class="sheet-body" id="detailBody"></div>
  </div>
</dialog>

<script>
(() => {
"use strict";

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd = n => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("en-US", {style:"currency", currency:"USD"}) : "—";
const eur = n => (typeof n === "number" && isFinite(n)) ? n.toLocaleString("en-US", {style:"currency", currency:"EUR"}) : "—";
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[’'`]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
const normNum = s => String(s || "").toUpperCase().replace(/\s+/g, "").replace(/\d+/g, d => String(parseInt(d, 10)));
const uid = () => (crypto.randomUUID ? crypto.randomUUID().replace(/-/g, "") : (Date.now().toString(36) + Math.random().toString(36).slice(2)));
const inClaude = !!(window.claude && typeof window.claude.use === "function");
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.append(t); setTimeout(() => t.remove(), 2600);
}
const ago = ts => {
  if (!ts) return "";
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return "just now"; if (m < 60) return m + " min ago";
  const h = Math.round(m / 60); if (h < 36) return h + " h ago";
  return Math.round(h / 24) + " days ago";
};

/* ---------- catalogue (official English card list) ---------- */
const Cat = { ready: false, sets: [], cards: [], rar: [], sup: [], byId: new Map(), version: "" };
async function loadCatalogue() {
  const r = await fetch("cards.json");
  if (!r.ok) throw new Error("catalogue " + r.status);
  const d = await r.json();
  Cat.version = d.v; Cat.rar = d.rarities; Cat.sup = d.supertypes;
  Cat.sets = d.sets.map(s => ({ id: s[0], name: s[1], series: s[2], total: s[3], code: s[4], released: s[5], n: norm(s[1]) }));
  Cat.cards = d.cards.map(c => {
    const set = Cat.sets[c[0]];
    const card = { set, number: c[1], name: c[2], rarity: Cat.rar[c[3]], supertype: Cat.sup[c[4]], id: c[5] || (set.id + "-" + c[1]), im: c[6] };
    card.n = norm(card.name); card.nn = normNum(card.number);
    return card;
  });
  for (const c of Cat.cards) Cat.byId.set(c.id, c);
  Cat.ready = true;
}
function cardImage(c, large) {
  if (!c) return "";
  if (c.im === 0) return `https://images.pokemontcg.io/${c.set.id}/${c.number}${large ? "_hires" : ""}.png`;
  if (c.im === 1) return `https://images.scrydex.com/pokemon/${c.id}/${large ? "large" : "small"}`;
  return large ? String(c.im).replace(/\/small$/, "/large").replace(/\.png$/, "_hires.png") : c.im;
}
function brief(c) {

    if (m) { num = normNum(m[1]); total = parseInt(m[2].replace(/\D/g, ""), 10); continue; }

/* match the text a reader pulled off the photo (collector number first, then names) */
function matchOCR(text) {
  if (!Cat.ready || !text) return { cands: [], number: "" };
  const t = String(text).replace(/[|\\]/g, "/");
  const fix = d => d.replace(/[Oo]/g, "0").replace(/[Il]/g, "1");
  const re = /(?:\b|(?<=[A-Z]))(TG|GG|SV|RC|SH|H)?([0-9OoIl]{1,3}[a-z]?)\s*\/\s*(?:TG|GG|SV|RC|SH|H)?\s?([0-9OoIl]{2,3})\b/g;

  while ((m = re.exec(t))) {

    const total = parseInt(fix(m[3]), 10), raw = m[0].replace(/\s+/g, "");
    if (m[1]) found.push({ num: normNum(m[1] + fix(m[2])), total, raw });
    found.push({ num: normNum(fix(m[2])), total, raw });
  }
  const promo = /\b(SWSH|SVP|SM|XY|BW|HGSS|DP|SV|TG|GG)\s?([0-9OoIl]{2,3})\b/g;
  while ((m = promo.exec(t))) found.push({ num: normNum(m[1] + fix(m[2])), total: null, raw: m[0].replace(/\s+/g, "") });
  const upper = " " + t.toUpperCase().replace(/[^A-Z0-9]+/g, " ") + " ";
  const nt = " " + norm(t) + " ";
  const score = new Map();
  const bump = (c, s) => { if (s > (score.get(c) || 0)) score.set(c, s); };
  for (const f of found) for (const c of Cat.cards) {
    if (c.nn !== f.num) continue;
    let s = 5;
    if (f.total && c.set.total === f.total) s += 3;
    if (c.n.length >= 3 && nt.includes(" " + c.n + " ")) s += 6;
    if (c.set.code && new RegExp("\\b" + c.set.code + "(?=[A-Z0-9 ])").test(upper)) s += 3;
    bump(c, s);
  }
  if (!score.size) for (const c of Cat.cards) {
    if (c.n.length >= 4 && nt.includes(" " + c.n + " ")) bump(c, 3 + c.n.length / 100 + (c.set.code && upper.includes(" " + c.set.code + " ") ? 3 : 0));

  const cands = [...score].sort((a, b) => b[1] - a[1] || (b[0].set.released > a[0].set.released ? 1 : -1)).slice(0, 8).map(x => x[0]);
  return { cands, number: found.length ? found[0].raw : "" };
}

/* ---------- rarity tiers ---------- */
function tier(r) {
  const s = String(r || "").toLowerCase();
  if (!s || s === "common" || s === "uncommon" || s === "promo") return "common";
  if (/secret|hyper|special illustration|gold|rainbow|shiny ultra|mega hyper|amazing|shining|star|legend/.test(s)) return "secret";
  if (/ultra|illustration|double|ex|gx|vmax|vstar|\bv\b|radiant|ace|break|prime|lv\.x|prism|trainer gallery|classic|full art/.test(s)) return "ultra";
  return "rare";

async function getJSON(url, ms = 12000) {

/* TCGdex updates daily, so it goes first. Its ids match the official ones for older

    } catch (e) { if (!e || !e.status) throw e; }

async function fetchPrices(cards) {
  const out = new Map(); let reached = false;
  const uniq = [...new Map(cards.filter(c => c.cardId).map(c => [c.cardId, c])).values()];
  let next = 0;
  const worker = async () => {
    while (next < uniq.length) {
      const card = uniq[next++];
      try { const p = await priceFromTCGdex(card); reached = true; if (p) out.set(card.cardId, p); }
      catch (e) { if (e && e.status) reached = true; }
    }
  };
  await Promise.all(Array.from({ length: Math.min(6, uniq.length) }, worker));
  const rest = uniq.map(c => c.cardId).filter(id => !hasUsd(out.get(id)));
  for (let i = 0; i < rest.length; i += 25) {
    const chunk = rest.slice(i, i + 25);
    const q = "(" + chunk.map(id => `id:"${id}"`).join(" OR ") + ")";
    try {
      const j = await getJSON(`https://api.pokemontcg.io/v2/cards?q=${encodeURIComponent(q)}&select=id,tcgplayer,cardmarket&pageSize=250`);
      reached = true;
      for (const c of (j.data || [])) {
        const p = fromPTCG(c); if (!p) continue;
        const have = out.get(c.id);
        if (!have) out.set(c.id, p);
        else if (!hasUsd(have) && hasUsd(p)) out.set(c.id, { ...have, usd: p.usd, source: "TCGdex (Cardmarket) and pokemontcg.io (TCGplayer)" });
      }
    } catch (e) { /* keep what TCGdex gave */ }
  }
  return { prices: out, reached };
}

/* ---------- prices on open ---------- */
const STALE = 6 * 3600 * 1000;
async function refreshPrices(force, only) {
  if (PriceState.busy) return; PriceState.busy = true;
  try {
    const due = (only || Store.cards).filter(c => c.cardId && (force || !c.price || !c.price.fetchedAt || Date.now() - c.price.fetchedAt > STALE));
    if (!due.length) return;
    const { prices, reached } = await fetchPrices(due);
    PriceState.tried = true;
    if (!reached) {
      PriceState.blocked = true;
      Notices.show("prices", inClaude
        ? "<b>Live prices can't load inside Claude.</b> Pages here can't reach outside websites, so prices load on the hosted copy of this app (no key needed)."
        : "<b>The price services didn't answer.</b> Prices will try again next time you open the app.");
      return;
    }
    PriceState.blocked = false; Notices.hide("prices");
    for (const c of due) {
      const p = prices.get(c.cardId);
      if (p) await Store.put({ ...c, price: p });
    }
  } finally { PriceState.busy = false; }
}

/* ---------- centering tool ---------- */
/* PSA's published front-centering limits: worst side ratio -> highest grade centering allows */
const CEN_CAPS = [[55, 10], [60, 9], [65, 8], [70, 7], [80, 6], [85, 5], [90, 3], [101, 1]];
function centeringEditor(host, url, box, done) {
  const b = Object.assign({ oL: 3, iL: 9, iR: 91, oR: 97, oT: 2.5, iT: 7, iB: 93, oB: 97.5 }, box || {});
  const LINES = [["oL", "v", "outer", "Card left edge"], ["iL", "v", "inner", "Frame left edge"], ["iR", "v", "inner", "Frame right edge"], ["oR", "v", "outer", "Card right edge"],
                 ["oT", "h", "outer", "Card top edge"], ["iT", "h", "inner", "Frame top edge"], ["iB", "h", "inner", "Frame bottom edge"], ["oB", "h", "outer", "Card bottom edge"]];
  const ORDER = { v: ["oL", "iL", "iR", "oR"], h: ["oT", "iT", "iB", "oB"] };
  host.innerHTML = `
    <p class="muted" style="margin:0">Drag the <span class="key-outer">red lines</span> to the card's outside edges and the <span class="key-inner">blue lines</span> to where the border meets the picture frame. A straight-on photo gives the truest reading.</p>
    <div class="cen-stage" id="cenStage"><img src="${esc(url)}" alt="Your photo of the card">${LINES.map(([k, dir, kind, label]) => `<div class="cen-line ${dir} ${kind}" data-k="${k}" tabindex="0" role="slider" aria-label="${label}"></div>`).join("")}</div>
    <div class="cen-read" id="cenRead"></div>
    <div class="actions"><button class="btn primary" type="button" id="cenDone">Use this centering</button><button class="btn" type="button" id="cenCancel">Cancel</button></div>`;
  const stage = $("#cenStage", host);
  const place = () => {
    stage.querySelectorAll(".cen-line").forEach(el => {
      const k = el.dataset.k, v = b[k];
      if (el.classList.contains("v")) el.style.left = v + "%"; else el.style.top = v + "%";
      el.setAttribute("aria-valuenow", v.toFixed(1));
    });
    const r = calc();
    $("#cenRead", host).innerHTML = `
      <div class="fact"><div class="k">Left / right</div><div class="v">${r.lr}</div></div>
      <div class="fact"><div class="k">Top / bottom</div><div class="v">${r.tb}</div></div>
      <div class="fact"><div class="k">Allows up to</div><div class="v">${r.cap}</div></div>`;
  };
  const calc = () => {
    const ratio = (a, z) => { const t = a + z; if (t <= 0) return 50; return Math.round(100 * a / t); };
    const l = ratio(b.iL - b.oL, b.oR - b.iR), t = ratio(b.iT - b.oT, b.oB - b.iB);
    const worst = Math.max(l, 100 - l, t, 100 - t);
    const cap = CEN_CAPS.find(([lim]) => worst <= lim)[1];
    return { lr: `${l}/${100 - l}`, tb: `${t}/${100 - t}`, cap };
  };
  const setVal = (k, v) => {
    const dir = ORDER.v.includes(k) ? "v" : "h"; const ord = ORDER[dir]; const i = ord.indexOf(k);
    const lo = i > 0 ? b[ord[i - 1]] + 0.3 : 0, hi = i < 3 ? b[ord[i + 1]] - 0.3 : 100;
    b[k] = Math.round(Math.max(lo, Math.min(hi, v)) * 10) / 10; place();
  };
  let drag = null;
  stage.addEventListener("pointerdown", e => {
    const el = e.target.closest(".cen-line"); if (!el) return;
    drag = el.dataset.k; el.setPointerCapture(e.pointerId); e.preventDefault();
  });
  stage.addEventListener("pointermove", e => {
    if (!drag) return; const rc = stage.getBoundingClientRect();
    setVal(drag, ORDER.v.includes(drag) ? (e.clientX - rc.left) / rc.width * 100 : (e.clientY - rc.top) / rc.height * 100);
  });
  const end = () => { drag = null; };
  stage.addEventListener("pointerup", end); stage.addEventListener("pointercancel", end);
  stage.addEventListener("keydown", e => {
    const el = e.target.closest(".cen-line"); if (!el) return; const k = el.dataset.k; const step = e.shiftKey ? 1 : 0.2;
    const d = { ArrowLeft: -step, ArrowUp: -step, ArrowRight: step, ArrowDown: step }[e.key]; if (d == null) return;
    e.preventDefault(); setVal(k, b[k] + d);
  });
  $("#cenDone", host).addEventListener("click", () => { const r = calc(); done({ box: { ...b }, text: `${r.lr} L-R, ${r.tb} T-B`, cap: r.cap }); });
  $("#cenCancel", host).addEventListener("click", () => done(null));
  place();
}

  }
  const p = c.price; const mine = pickPrice(c);
  const usdRows = p && p.usd ? Object.entries(p.usd).map(([k, v]) => `<tr class="${k === (mine && mine.finish) ? "mine" : ""}"><td>${esc(finishLabel(k))}</td><td>${usd(v.market)}</td><td>${usd(v.low)}</td><td>${usd(v.mid)}</td><td>${usd(v.high)}</td></tr>`).join("") : "";
  const eurRow = p && p.eur ? `<p class="src" style="margin:8px 0 0">Cardmarket (Europe): trend ${eur(p.eur.trend)} · 30-day average ${eur(p.eur.avg30)} · low ${eur(p.eur.low)}</p>` : "";
  let priceHtml;
  if (usdRows) priceHtml = `<div class="tbl-wrap"><table><thead><tr><th>TCGplayer</th><th>Market</th><th>Low</th><th>Mid</th><th>High</th></tr></thead><tbody>${usdRows}</tbody></table></div>${eurRow}
      <p class="src" style="margin:8px 0 0">From ${esc(p.source)}${p.updated ? `, prices dated ${esc(String(p.updated).slice(0, 10))}` : ""}. Checked ${esc(ago(p.fetchedAt))}.</p>`;
  else if (p && p.eur) priceHtml = eurRow + `<p class="src">From ${esc(p.source)}. Checked ${esc(ago(p.fetchedAt))}.</p>`;
  else priceHtml = `<p class="muted" style="margin:0">${PriceState.blocked && inClaude ? "Live prices load on the hosted copy of this app. Inside Claude, pages can't reach the price services." : PriceState.tried ? "No price listed for this card yet." : "Checking prices…"}</p>`;
  const searchName = `${c.name} ${c.number}/${c.printedTotal || ""} ${c.setName}`;
  const ebay = `https://www.ebay.com/sch/i.html?_nkw=${encodeURIComponent(searchName + " PSA")}&LH_Sold=1&LH_Complete=1`;
  const tcgp = (p && p.url) || `https://www.tcgplayer.com/search/pokemon/product?q=${encodeURIComponent(c.name + " " + c.number)}`;

  b.innerHTML = `
    <div class="detail-hero">
      <figure>${photo ? `<img src="${esc(photo)}" alt="Your photo of ${esc(c.name)}">` : `<div class="ph">No photo</div>`}<figcaption>Your photo</figcaption></figure>
      <figure>${cat ? `<img src="${esc(cardImage(cat, true))}" alt="Catalogue image of ${esc(c.name)}" data-fail="ph">` : `<div class="ph">No catalogue image</div>`}<figcaption>Catalogue</figcaption></figure>
    </div>
    <div class="facts">
      <div class="fact"><div class="k">Set</div><div class="v">${esc(c.setName)}</div><div class="muted" style="font-size:12px">${esc(c.series || "")} · ${esc(String(c.released || "").slice(0, 4))}</div></div>
      <div class="fact"><div class="k">Number</div><div class="v mono">${esc(c.setCode || c.setId)} ${esc(c.number)}/${esc(c.printedTotal || "?")}</div><div class="muted" style="font-size:12px">ID ${esc(c.cardId)}</div></div>
      <div class="fact"><div class="k">Rarity</div><div class="v">${c.rarity ? `<span class="chip t-${tier(c.rarity)}">${esc(c.rarity)}</span>` : "Not listed"}</div></div>
      <div class="fact"><div class="k">Value each</div><div class="v num">${mine ? usd(mine.value) : "—"}</div><div class="muted" style="font-size:12px">${mine ? "TCGplayer market, " + esc(finishLabel(mine.finish)) : "No price yet"}</div></div>
    </div>
    <div class="grid2">
      <div class="field"><label for="dFin">Finish</label><select id="dFin">${FINISHES.map(([k, l]) => `<option value="${k}" ${k === c.finish ? "selected" : ""}>${l}</option>`).join("")}</select></div>
      <div class="field"><label for="dQty">Copies</label><input id="dQty" type="number" min="1" max="999" value="${c.qty || 1}"></div>
    </div>
    ${slabHtml(c.condition) || `<p class="muted" style="margin:0">No condition estimate for this card.</p>`}
    ${!c.condition || c.condition.source !== "photo" ? `<div class="field"><label for="dCond">Condition (your call)</label><select id="dCond">${condOptions(c.condition && c.condition.grade)}</select></div>` : ""}
    ${photo ? `<div><button class="btn small" type="button" id="dCen">${c.condition && c.condition.centeringMeasured ? "Measure centering again" : "Measure centering"}</button></div>` : ""}
    <div><p class="section-label">Prices</p>${priceHtml}</div>
    <div class="actions">
      <button class="btn small" type="button" id="dRefresh">Refresh price</button>
      <a class="btn small ghost" href="${esc(tcgp)}" target="_blank" rel="noopener">TCGplayer</a>
      <a class="btn small ghost" href="${esc(ebay)}" target="_blank" rel="noopener">Graded sold listings</a>
    </div>
    <p class="src" style="margin:0">No free source tracks graded sales, so the last link opens eBay's sold PSA listings for this card.</p>
    ${confirmDelete ? `<div class="confirm"><b>Remove ${esc(c.name)} from your collection?</b><span class="muted">This deletes its photo too.</span><div class="actions"><button class="btn danger small" type="button" id="dDelYes">Remove card</button><button class="btn small" type="button" id="dDelNo">Keep it</button></div></div>`
      : `<div><button class="btn danger small" type="button" id="dDel">Remove from collection</button></div>`}`;
  $("#dFin").addEventListener("change", e => Store.put({ ...c, finish: e.target.value }).then(renderDetail));
  $("#dQty").addEventListener("change", e => Store.put({ ...c, qty: Math.max(1, Math.min(999, parseInt(e.target.value) || 1)) }).then(renderDetail));
  const dc = $("#dCond"); if (dc) dc.addEventListener("change", e => Store.put({ ...c, condition: { ...(c.condition || {}), source: "manual", grade: e.target.value ? Number(e.target.value) : null } }).then(renderDetail));
  const dcen = $("#dCen"); if (dcen) dcen.addEventListener("click", () => { detailCentering = true; renderDetail(); });
  $("#dRefresh").addEventListener("click", async e => { e.target.disabled = true; e.target.textContent = "Checking…"; await refreshPrices(true, [c]).catch(() => {}); renderDetail(); });
  const del = $("#dDel"); if (del) del.addEventListener("click", () => { confirmDelete = true; renderDetail(); });
  const yes = $("#dDelYes"); if (yes) yes.addEventListener("click", async () => { const name = c.name; await Store.remove(c); photoCache.delete(c.id); $("#detailSheet").close(); toast(`Removed ${name}`); });
  const no = $("#dDelNo"); if (no) no.addEventListener("click", () => { confirmDelete = false; renderDetail(); });
}

/* ---------- wiring ---------- */
document.addEventListener("error", e => {
  const im = e.target; if (!im || im.tagName !== "IMG" || !im.dataset.fail) return;
  if (im.dataset.fail === "ph") { const d = document.createElement("div"); d.className = "ph"; d.textContent = inClaude ? "Catalogue image shows on the hosted copy" : "Catalogue image unavailable"; im.replaceWith(d); }
  else im.remove();
}, true);
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => b.closest("dialog").close()));
$("#fab").addEventListener("click", openAdd); $("#emptyAdd").addEventListener("click", openAdd);
$("#list").addEventListener("click", e => { const r = e.target.closest("[data-open]"); if (r) openDetail(r.dataset.open); });
$("#q").addEventListener("input", e => { view.q = e.target.value; renderList(); });
$("#fSet").addEventListener("change", e => { view.set = e.target.value; renderList(); });
$("#fRarity").addEventListener("change", e => { view.rarity = e.target.value; renderList(); });
$("#fSort").addEventListener("change", e => { view.sort = e.target.value; try { localStorage.setItem("pokelab-sort", view.sort); } catch (x) {} renderList(); });
try { const s = localStorage.getItem("pokelab-sort"); if (s) { view.sort = s; $("#fSort").value = s; } } catch (x) {}
Store.onChange(() => { renderList(); if ($("#detailSheet").open) renderDetail(); });

(async function boot() {
  $("#filters").hidden = true; $("#empty").hidden = false;
  const cat = loadCatalogue().catch(() => Notices.show("cat", "The card catalogue didn't load, so new cards can't be matched. Reopen the page to try again.", false));
  await Promise.all([Store.init(), initAI(), cat]);
  $("#modeLine").textContent = `${Cat.cards.length.toLocaleString()} English cards · ${Cat.sets.length} sets` + (Store.mode === "cloud" ? " · saved to your Claude account" : Store.mode === "local" ? " · saved in this browser" : "");
  if (!(AI.sample && AI.images)) $("#emptyText").textContent = ocrUsable()
    ? "Tap Add a card and take a photo of the front. The app reads the collector number to find the card, then logs it with its official set, rarity and live price. You can measure centering from the photo too."
    : "Tap Add a card, add a photo of the front, then find it by name or number. It's logged with its official set, number, rarity and price.";
  renderList();
  refreshPrices(false).catch(() => {});
})();
})();
</script>

<script>if("serviceWorker" in navigator&&location.protocol==="https:"){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
</body>
</html>
