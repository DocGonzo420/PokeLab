/* the 3 x 3 map that sends the corners of a w x h box to the four points q (perspective) */

(async()=>{const out=document.getElementById("out");let lines=[],ok=0,n=0,tt=0;

  if(!good||t==4){const g=cv.getContext("2d");g.strokeStyle="#0f0";g.lineWidth=3;if(r){g.beginPath();r.pts.forEach((p,i)=>{const X=p.x*W/100,Y=p.y*H/100;i?g.lineTo(X,Y):g.moveTo(X,Y);});g.closePath();g.stroke();}

 }}
